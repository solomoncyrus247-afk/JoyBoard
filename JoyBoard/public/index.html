<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoyBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- LOGIN / REGISTER -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon">J</div>
        <div>
          <h1>JoyBoard</h1>
          <p>Simple. Private. Connected.</p>
        </div>
      </div>

      <div class="auth-tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Create account</button>
      </div>

      <form id="authForm">

        <div id="nameGroup" class="field hidden">
          <label>Full name</label>
          <input id="name" type="text" placeholder="Your name">
        </div>

        <div class="field">
          <label>Email</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="password"
            type="password"
            placeholder="At least 6 characters"
            required
          >
        </div>

        <button id="authButton" class="primary-button" type="submit">
          Login
        </button>

        <p id="authMessage" class="form-message"></p>

      </form>

    </div>
  </section>


  <!-- CHAT APPLICATION -->
  <main id="chatApp" class="chat-app hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- MY PROFILE -->
      <header class="sidebar-header">

        <div class="my-profile">

          <button
            id="myAvatar"
            class="avatar profile-avatar-button"
            type="button"
            title="Change profile picture"
          >
            J
          </button>

          <div>
            <strong id="myName">You</strong>
            <small>JoyBoard</small>
          </div>

        </div>

        <div class="profile-actions">

          <button
            id="editProfileButton"
            class="icon-button"
            type="button"
            title="Edit profile"
          >
            ✎
          </button>

          <button
            id="logoutButton"
            class="icon-button"
            title="Logout"
            type="button"
          >
            ↪
          </button>

        </div>

      </header>


      <!-- PROFILE PICTURE INPUT -->
      <input
        id="profilePictureInput"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
      >


      <!-- FRIEND MENU -->
      <div class="friend-menu">

        <button
          id="friendsButton"
          class="friend-menu-button active"
          type="button"
        >
          👥 Friends
          <span id="friendsCount">0</span>
        </button>

        <button
          id="requestsButton"
          class="friend-menu-button"
          type="button"
        >
          📨 Requests
          <span id="requestsCount">0</span>
        </button>

      </div>


      <!-- SEARCH -->
      <div class="search-box">
        <span>⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search people"
        >
      </div>


      <!-- PAGE TITLE -->
      <div id="listTitle" class="list-title">
        My Friends
      </div>


      <!-- USERS / FRIENDS / REQUESTS -->
      <div id="userList" class="user-list"></div>

    </aside>


    <!-- CHAT PANEL -->
    <section class="chat-panel">

      <!-- EMPTY CHAT -->
      <div id="emptyChat" class="empty-chat">

        <div class="empty-logo">J</div>

        <h2>Welcome to JoyBoard</h2>

        <p>
          Add friends and start private conversations.
        </p>

      </div>


      <!-- CONVERSATION -->
      <div id="conversation" class="conversation hidden">

        <header class="chat-header">

          <button
            id="backButton"
            class="back-button"
            type="button"
          >
            ‹
          </button>

          <div id="chatAvatar" class="avatar">
            ?
          </div>

          <div class="chat-person">

            <strong id="chatName">
              Person
            </strong>

            <span id="chatStatus">
              offline
            </span>

          </div>

        </header>


        <!-- MESSAGES -->
        <div id="messages" class="messages"></div>


        <!-- TYPING -->
        <div
          id="typingIndicator"
          class="typing hidden"
        >
          typing…
        </div>


        <!-- MESSAGE FORM -->
        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            autocomplete="off"
            placeholder="Type a message"
          >

          <button type="submit">
            ➤
          </button>

        </form>

      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
