<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoyBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">J</div>
        <div>
          <h1>JoyBoard</h1>
          <p>Simple. Private. Connected.</p>
        </div>
      </div>

      <div class="auth-tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Create account</button>
      </div>

      <form id="authForm">
        <div id="nameGroup" class="field hidden">
          <label>Full name</label>
          <input id="name" type="text" placeholder="Your name">
        </div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input id="password" type="password" placeholder="At least 6 characters" required>
        </div>

        <button id="authButton" class="primary-button" type="submit">Login</button>
        <p id="authMessage" class="form-message"></p>
      </form>
    </div>
  </section>

  <main id="chatApp" class="chat-app hidden">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="my-profile">
          <div id="myAvatar" class="avatar">J</div>
          <div>
            <strong id="myName">You</strong>
            <small>JoyBoard</small>
          </div>
        </div>
        <button id="logoutButton" class="icon-button" title="Logout">↪</button>
      </header>

      <div class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Search people">
      </div>

      <div id="userList" class="user-list"></div>
    </aside>

    <section class="chat-panel">
      <div id="emptyChat" class="empty-chat">
        <div class="empty-logo">J</div>
        <h2>Welcome to JoyBoard</h2>
        <p>Search for someone and start a private conversation.</p>
      </div>

      <div id="conversation" class="conversation hidden">
        <header class="chat-header">
          <button id="backButton" class="back-button">‹</button>
          <div id="chatAvatar" class="avatar">?</div>
          <div class="chat-person">
            <strong id="chatName">Person</strong>
            <span id="chatStatus">offline</span>
          </div>
        </header>

        <div id="messages" class="messages"></div>
        <div id="typingIndicator" class="typing hidden">typing…</div>

        <form id="messageForm" class="message-form">
          <input id="messageInput" autocomplete="off" placeholder="Type a message">
          <button type="submit">➤</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
